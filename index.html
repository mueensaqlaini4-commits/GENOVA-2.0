<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#030712">

<title>GENOVA 2.1</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02040b;
  color:white;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  touch-action:none;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 45%,
      #13234b 0%,
      #070c1e 42%,
      #02040b 100%
    );
}

#three{
  position:absolute;
  inset:0;
  z-index:1;
}

#three canvas{
  display:block;
  width:100%;
  height:100%;
}

.overlay{
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:75px;
  padding:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:
    linear-gradient(
      to bottom,
      rgba(2,4,12,.9),
      transparent
    );
}

.logo{
  width:43px;
  height:43px;
  border-radius:14px;
  display:grid;
  place-items:center;
  border:1px solid rgba(90,220,255,.35);
  background:rgba(20,30,60,.5);
  font-size:21px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand h1{
  font-size:16px;
  letter-spacing:3px;
}

.brand p{
  margin-top:3px;
  font-size:7px;
  letter-spacing:2px;
  opacity:.45;
}

.status{
  pointer-events:auto;
  padding:8px 10px;
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px;
  background:rgba(5,10,25,.7);
  font-size:8px;
  letter-spacing:1px;
}

.status i{
  display:inline-block;
  width:6px;
  height:6px;
  margin-right:6px;
  border-radius:50%;
  background:#50ffc0;
  box-shadow:0 0 10px #50ffc0;
}

.title{
  position:absolute;
  left:16px;
  top:87px;
}

.title h2{
  font-size:21px;
  letter-spacing:2px;
}

.title p{
  margin-top:4px;
  font-size:8px;
  letter-spacing:2px;
  opacity:.45;
}

.flow{
  position:absolute;
  left:14px;
  right:14px;
  top:133px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
  pointer-events:auto;
}

.flow::-webkit-scrollbar{
  display:none;
}

.node{
  flex:0 0 auto;
  min-width:53px;
  height:43px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(6,11,26,.7);
  color:white;
  font-size:8px;
  letter-spacing:1px;
}

.node b{
  display:block;
  font-size:15px;
  margin-bottom:2px;
}

.node.active{
  border-color:rgba(80,220,255,.6);
  background:rgba(20,75,105,.65);
  box-shadow:0 0 20px rgba(50,210,255,.15);
}

.bottom{
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
  pointer-events:auto;
}

.btn{
  height:44px;
  min-width:52px;
  padding:0 11px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(5,10,25,.78);
  color:white;
  font-size:8px;
  letter-spacing:1px;
  backdrop-filter:blur(12px);
}

.btn:active{
  transform:scale(.94);
}

.primary{
  border-color:rgba(80,220,255,.5);
  background:rgba(12,65,95,.7);
}

.panel{
  display:none;
  position:absolute;
  z-index:20;
  left:12px;
  right:12px;
  bottom:67px;
  max-height:58vh;
  overflow:auto;
  padding:15px;
  border-radius:21px;
  border:1px solid rgba(255,255,255,.13);
  background:rgba(4,9,23,.94);
  backdrop-filter:blur(22px);
  pointer-events:auto;
}

.panel.show{
  display:block;
}

.panelHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.panelHead h3{
  font-size:13px;
  letter-spacing:2px;
}

.close{
  border:0;
  background:none;
  color:white;
  font-size:23px;
}

.info{
  padding:11px;
  margin-bottom:9px;
  border-radius:13px;
  background:rgba(255,255,255,.045);
  font-size:9px;
  line-height:1.5;
  opacity:.8;
}

.sequence{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-bottom:12px;
}

.base{
  width:29px;
  height:29px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.05);
  font-weight:bold;
}

.base.selected{
  outline:2px solid white;
  transform:translateY(-2px);
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.grid button{
  width:100%;
}

.toast{
  position:absolute;
  z-index:50;
  left:50%;
  bottom:63px;
  transform:translate(-50%,20px);
  padding:10px 14px;
  border-radius:13px;
  background:rgba(5,10,24,.95);
  border:1px solid rgba(80,220,255,.35);
  font-size:9px;
  letter-spacing:.5px;
  opacity:0;
  transition:.25s;
  white-space:nowrap;
  pointer-events:none;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.scanlines{
  position:absolute;
  inset:0;
  z-index:3;
  pointer-events:none;
  opacity:.07;
  background:
    linear-gradient(
      rgba(255,255,255,.08) 1px,
      transparent 1px
    );
  background-size:100% 5px;
}

#fatal{
  display:none;
  position:absolute;
  z-index:100;
  inset:0;
  padding:30px;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#02040b;
}

#fatal.show{
  display:flex;
}

.fatalBox{
  max-width:340px;
}

.fatalBox h2{
  font-size:18px;
  letter-spacing:2px;
  margin-bottom:10px;
}

.fatalBox p{
  font-size:11px;
  opacity:.6;
  line-height:1.6;
}

@media(max-width:430px){
  .brand h1{
    font-size:14px;
  }

  .btn{
    min-width:47px;
    padding:0 8px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="three"></div>

  <div class="scanlines"></div>

  <div class="overlay">

    <div class="top">

      <div class="brand">

        <div class="logo">🧬</div>

        <div>
          <h1>GENOVA</h1>
          <p>ADVANCED BIOLOGY SIMULATION</p>
        </div>

      </div>

      <div class="status">
        <i></i> VIRTUAL LAB
      </div>

    </div>

    <div class="title">
      <h2 id="mode">CELL</h2>
      <p id="sub">BIOLOGICAL SYSTEM</p>
    </div>

    <div class="flow">

      <button class="node active" data-mode="cell">
        <b>◉</b>CELL
      </button>

      <button class="node" data-mode="nucleus">
        <b>◎</b>NUCLEUS
      </button>

      <button class="node" data-mode="chromosome">
        <b>✣</b>DNA PACK
      </button>

      <button class="node" data-mode="dna">
        <b>🧬</b>DNA
      </button>

      <button class="node" data-mode="rna">
        <b>⌁</b>RNA
      </button>

      <button class="node" data-mode="protein">
        <b>●</b>PROTEIN
      </button>

      <button class="node" data-mode="genetics">
        <b>♬</b>GENETICS
      </button>

    </div>

    <div class="panel" id="panel">

      <div class="panelHead">
        <h3 id="panelTitle">DNA LAB</h3>
        <button class="close" onclick="closePanel()">×</button>
      </div>

      <div id="panelContent"></div>

    </div>

    <div class="bottom">

      <button class="btn primary" onclick="nextLevel()">
        NEXT
      </button>

      <button class="btn" onclick="openDNA()">
        DNA
      </button>

      <button class="btn" onclick="openSim()">
        SIM
      </button>

      <button class="btn" onclick="openGenetics()">
        GENETICS
      </button>

      <button class="btn" onclick="resetAll()">
        RESET
      </button>

    </div>

    <div class="toast" id="toast"></div>

  </div>

  <div id="fatal">
    <div class="fatalBox">
      <h2>GENOVA</h2>
      <p>
        3D engine load nahi ho saka.<br>
        Internet connection check karke page refresh karein.
      </p>
    </div>
  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

"use strict";

/* =====================================================
   GENOVA 2.1
   SINGLE FILE BIOLOGY SIMULATION
   ===================================================== */

let scene;
let camera;
let renderer;
let controls;

let world;

const groups={};

let currentMode="cell";

let sequence=[
  "A","T","G","C",
  "A","C","G","T",
  "T","A","C","G",
  "G","C","A","T",
  "A","G","C","T",
  "C","G","A","T"
];

const originalSequence=sequence.slice();

let selectedIndex=-1;
let history=[];

const BASE_COLOR={
  A:0x42bfff,
  T:0xff6388,
  G:0x60e68a,
  C:0xffc94f
};


/* =====================================================
   START
   ===================================================== */

window.addEventListener("load",function(){

  setTimeout(function(){

    try{

      if(typeof THREE==="undefined"){
        showFatal();
        return;
      }

      init();

    }catch(error){

      console.error(error);
      showFatal();

    }

  },100);

});


/* =====================================================
   INIT
   ===================================================== */

function init(){

  scene=new THREE.Scene();

  scene.background=new THREE.Color(0x02040b);

  camera=new THREE.PerspectiveCamera(
    55,
    window.innerWidth/window.innerHeight,
    .1,
    500
  );

  camera.position.set(0,0,19);

  renderer=new THREE.WebGLRenderer({
    antialias:true,
    alpha:false
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio || 1,1.7)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document
    .getElementById("three")
    .appendChild(renderer.domElement);


  /* LIGHT */

  scene.add(
    new THREE.AmbientLight(
      0xffffff,
      1.2
    )
  );

  const lightA=
    new THREE.PointLight(
      0x38cfff,
      16,
      70
    );

  lightA.position.set(8,8,12);

  scene.add(lightA);


  const lightB=
    new THREE.PointLight(
      0x9c55ff,
      12,
      60
    );

  lightB.position.set(-8,-7,8);

  scene.add(lightB);


  world=new THREE.Group();

  scene.add(world);


  [
    "cell",
    "nucleus",
    "chromosome",
    "dna",
    "rna",
    "protein",
    "genetics"
  ].forEach(function(name){

    groups[name]=new THREE.Group();

    world.add(groups[name]);

  });


  createStars();

  createCell();

  createNucleus();

  createChromosome();

  createDNA();

  createRNA();

  createProtein();

  createGenetics();


  /* SIMPLE CAMERA CONTROL */

  setupControls();


  setMode("cell");

  animate();


  window.addEventListener(
    "resize",
    resize
  );

}


/* =====================================================
   SIMPLE TOUCH / MOUSE CAMERA
   ===================================================== */

let dragging=false;
let lastX=0;
let lastY=0;

function setupControls(){

  const canvas=renderer.domElement;

  canvas.addEventListener(
    "pointerdown",
    function(e){

      dragging=true;

      lastX=e.clientX;
      lastY=e.clientY;

      selectObject(e);

    }
  );

  canvas.addEventListener(
    "pointermove",
    function(e){

      if(!dragging)return;

      const dx=e.clientX-lastX;
      const dy=e.clientY-lastY;

      lastX=e.clientX;
      lastY=e.clientY;

      world.rotation.y+=dx*.006;
      world.rotation.x+=dy*.004;

    }
  );

  canvas.addEventListener(
    "pointerup",
    function(){
      dragging=false;
    }
  );

  canvas.addEventListener(
    "pointercancel",
    function(){
      dragging=false;
    }
  );

  canvas.addEventListener(
    "wheel",
    function(e){

      camera.position.z+=e.deltaY*.012;

      camera.position.z=
        Math.max(
          7,
          Math.min(
            35,
            camera.position.z
          )
        );

    },
    {passive:true}
  );

}


/* =====================================================
   STARS
   ===================================================== */

function createStars(){

  const geometry=
    new THREE.BufferGeometry();

  const count=700;

  const positions=
    new Float32Array(count*3);

  for(let i=0;i<count;i++){

    positions[i*3]=
      (Math.random()-.5)*120;

    positions[i*3+1]=
      (Math.random()-.5)*120;

    positions[i*3+2]=
      (Math.random()-.5)*120;

  }

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(
      positions,
      3
    )
  );

  const material=
    new THREE.PointsMaterial({
      color:0x78dfff,
      size:.035,
      transparent:true,
      opacity:.65
    });

  const stars=
    new THREE.Points(
      geometry,
      material
    );

  scene.add(stars);

  stars.userData.star=true;

}


/* =====================================================
   CELL
   ===================================================== */

function createCell(){

  const g=groups.cell;

  const membrane=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        6.5,
        48,
        48
      ),
      new THREE.MeshPhongMaterial({
        color:0x45caff,
        transparent:true,
        opacity:.10,
        side:THREE.DoubleSide
      })
    );

  g.add(membrane);


  const wire=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        6.55,
        32,
        32
      ),
      new THREE.MeshBasicMaterial({
        color:0x49d8ff,
        transparent:true,
        opacity:.08,
        wireframe:true
      })
    );

  g.add(wire);


  const nucleus=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        2.5,
        32,
        32
      ),
      new THREE.MeshPhongMaterial({
        color:0x754cff,
        transparent:true,
        opacity:.48,
        emissive:0x331080
      })
    );

  nucleus.name="NUCLEUS";

  g.add(nucleus);


  /* mitochondria */

  for(let i=0;i<9;i++){

    const m=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .5,
          16,
          12
        ),
        new THREE.MeshPhongMaterial({
          color:0xff704d,
          emissive:0x401000
        })
      );

    m.scale.set(1.7,.7,.8);

    const a=i/9*Math.PI*2;

    m.position.set(
      Math.cos(a)*4,
      Math.sin(a*1.8)*2.2,
      Math.sin(a)*3.3
    );

    m.rotation.z=a;

    g.add(m);

  }


  /* ribosomes */

  for(let i=0;i<50;i++){

    const r=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .07,
          8,
          8
        ),
        new THREE.MeshBasicMaterial({
          color:0x72ddff
        })
      );

    const a=Math.random()*Math.PI*2;
    const b=Math.acos(
      2*Math.random()-1
    );

    const radius=5.2;

    r.position.set(
      radius*Math.sin(b)*Math.cos(a),
      radius*Math.sin(b)*Math.sin(a),
      radius*Math.cos(b)
    );

    g.add(r);

  }

}


/* =====================================================
   NUCLEUS
   ===================================================== */

function createNucleus(){

  const g=groups.nucleus;

  const shell=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        5,
        40,
        40
      ),
      new THREE.MeshBasicMaterial({
        color:0x835cff,
        transparent:true,
        opacity:.08,
        wireframe:true
      })
    );

  g.add(shell);


  for(let n=0;n<12;n++){

    const points=[];

    for(let i=0;i<25;i++){

      const t=i*.45;

      points.push(
        new THREE.Vector3(
          Math.sin(t+n)*1.8,
          Math.cos(t*1.2+n)*1.8,
          Math.sin(t*.7+n)*1.8
        )
      );

    }

    const curve=
      new THREE.CatmullRomCurve3(
        points
      );

    const fiber=
      new THREE.Mesh(
        new THREE.TubeGeometry(
          curve,
          60,
          .045,
          6,
          false
        ),
        new THREE.MeshBasicMaterial({
          color:n%2?
            0x65ddff:
            0xa26cff
        })
      );

    fiber.name="CHROMOSOME";

    g.add(fiber);

  }

}


/* =====================================================
   CHROMOSOME
   ===================================================== */

function createChromosome(){

  const g=groups.chromosome;

  const makeArm=function(side){

    const pts=[];

    for(let i=0;i<25;i++){

      const y=4.2-i*.35;

      const wave=
        Math.sin(i*.45)*.55;

      pts.push(
        new THREE.Vector3(
          side*(1.0+wave),
          y,
          0
        )
      );

    }

    const curve=
      new THREE.CatmullRomCurve3(
        pts
      );

    return new THREE.Mesh(
      new THREE.TubeGeometry(
        curve,
        60,
        .16,
        10,
        false
      ),
      new THREE.MeshPhongMaterial({
        color:
          side<0?
          0x4ed8ff:
          0xa269ff,
        emissive:
          side<0?
          0x07384a:
          0x24104d
      })
    );

  };


  const a=makeArm(-1);
  const b=makeArm(1);

  a.rotation.z=.55;
  b.rotation.z=-.55;

  g.add(a,b);


  const center=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .55,
        24,
        24
      ),
      new THREE.MeshPhongMaterial({
        color:0xffd35b,
        emissive:0x4b2d00
      })
    );

  center.name="DNA";

  g.add(center);

}


/* =====================================================
   DNA
   ===================================================== */

function createDNA(){

  const g=groups.dna;

  while(g.children.length){

    g.remove(g.children[0]);

  }

  const radius=2.2;
  const step=.42;

  for(let i=0;i<sequence.length;i++){

    const angle=i*step;

    const y=
      (i-(sequence.length-1)/2)*.38;

    const p1=
      new THREE.Vector3(
        Math.cos(angle)*radius,
        y,
        Math.sin(angle)*radius
      );

    const p2=
      new THREE.Vector3(
        Math.cos(angle+Math.PI)*radius,
        y,
        Math.sin(angle+Math.PI)*radius
      );


    const s1=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .22,
          14,
          14
        ),
        new THREE.MeshPhongMaterial({
          color:BASE_COLOR[sequence[i]],
          emissive:BASE_COLOR[sequence[i]],
          emissiveIntensity:.15
        })
      );

    s1.position.copy(p1);

    s1.userData.index=i;

    s1.userData.base=sequence[i];

    g.add(s1);


    const s2=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .22,
          14,
          14
        ),
        new THREE.MeshPhongMaterial({
          color:
            BASE_COLOR[
              complement(sequence[i])
            ],
          emissive:
            BASE_COLOR[
              complement(sequence[i])
            ],
          emissiveIntensity:.15
        })
      );

    s2.position.copy(p2);

    g.add(s2);


    const distance=p1.distanceTo(p2);

    const bond=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .045,
          .045,
          distance,
          6
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff,
          transparent:true,
          opacity:.3
        })
      );

    bond.position.copy(
      p1.clone()
        .add(p2)
        .multiplyScalar(.5)
    );

    bond.lookAt(p2);

    bond.rotateX(Math.PI/2);

    g.add(bond);

  }


  /* backbone */

  const p1=[];
  const p2=[];

  for(let i=0;i<sequence.length;i++){

    const angle=i*step;

    const y=
      (i-(sequence.length-1)/2)*.38;

    p1.push(
      new THREE.Vector3(
        Math.cos(angle)*radius,
        y,
        Math.sin(angle)*radius
      )
    );

    p2.push(
      new THREE.Vector3(
        Math.cos(angle+Math.PI)*radius,
        y,
        Math.sin(angle+Math.PI)*radius
      )
    );

  }

  const c1=
    new THREE.CatmullRomCurve3(p1);

  const c2=
    new THREE.CatmullRomCurve3(p2);

  g.add(
    new THREE.Mesh(
      new THREE.TubeGeometry(
        c1,
        100,
        .065,
        8,
        false
      ),
      new THREE.MeshBasicMaterial({
        color:0x5bdcff
      })
    )
  );

  g.add(
    new THREE.Mesh(
      new THREE.TubeGeometry(
        c2,
        100,
        .065,
        8,
        false
      ),
      new THREE.MeshBasicMaterial({
        color:0xff62a7
      })
    )
  );

}


/* =====================================================
   RNA
   ===================================================== */

function createRNA(){

  const g=groups.rna;

  while(g.children.length){
    g.remove(g.children[0]);
  }

  const points=[];

  for(let i=0;i<sequence.length;i++){

    points.push(
      new THREE.Vector3(
        Math.sin(i*.65)*1.3,
        (i-12)*.45,
        Math.cos(i*.65)*1.3
      )
    );

  }

  const curve=
    new THREE.CatmullRomCurve3(points);

  g.add(
    new THREE.Mesh(
      new THREE.TubeGeometry(
        curve,
        100,
        .11,
        8,
        false
      ),
      new THREE.MeshPhongMaterial({
        color:0xff5fa6,
        emissive:0x441020
      })
    )
  );


  points.forEach(function(p,i){

    const n=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .22,
          12,
          12
        ),
        new THREE.MeshPhongMaterial({
          color:
            BASE_COLOR[
              sequence[i]
            ]
        })
      );

    n.position.copy(p);

    n.position.x+=.25;

    g.add(n);

  });

}


/* =====================================================
   PROTEIN
   ===================================================== */

function createProtein(){

  const g=groups.protein;

  while(g.children.length){
    g.remove(g.children[0]);
  }

  const points=[];

  const cols=[
    0x4db6ff,
    0x61e58b,
    0xffc957,
    0xff6688,
    0xa26cff
  ];

  for(let i=0;i<42;i++){

    const t=i*.5;

    points.push(
      new THREE.Vector3(
        Math.sin(t)*2.4,
        (i-21)*.25,
        Math.cos(t)*2.4
      )
    );

  }

  const curve=
    new THREE.CatmullRomCurve3(points);

  g.add(
    new THREE.Mesh(
      new THREE.TubeGeometry(
        curve,
        150,
        .09,
        8,
        false
      ),
      new THREE.MeshBasicMaterial({
        color:0x6fe0ff
      })
    )
  );


  points.forEach(function(p,i){

    const sphere=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .25,
          14,
          14
        ),
        new THREE.MeshPhongMaterial({
          color:cols[i%cols.length],
          emissive:cols[i%cols.length],
          emissiveIntensity:.12
        })
      );

    sphere.position.copy(p);

    g.add(sphere);

  });

}


/* =====================================================
   GENETICS
   ===================================================== */

function createGenetics(){

  const g=groups.genetics;

  while(g.children.length){
    g.remove(g.children[0]);
  }

  for(let i=0;i<6;i++){

    const y=(i-2.5)*1.1;

    const a=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .42,
          16,
          16
        ),
        new THREE.MeshPhongMaterial({
          color:0x58dfff
        })
      );

    const b=
      new THREE.Mesh(
        new THREE.SphereGeometry(
          .42,
          16,
          16
        ),
        new THREE.MeshPhongMaterial({
          color:0xff6688
        })
      );

    a.position.set(-3,y,0);
    b.position.set(3,y,0);

    g.add(a,b);

    const bar=
      new THREE.Mesh(
        new THREE.CylinderGeometry(
          .06,
          .06,
          6,
          8
        ),
        new THREE.MeshBasicMaterial({
          color:0xffffff,
          transparent:true,
          opacity:.3
        })
      );

    bar.rotation.z=Math.PI/2;
    bar.position.y=y;

    g.add(bar);

  }


  const child=
    new THREE.Mesh(
      new THREE.SphereGeometry(
        1.3,
        32,
        32
      ),
      new THREE.MeshPhongMaterial({
        color:0x5cdfff,
        transparent:true,
        opacity:.3,
        emissive:0x0c6170
      })
    );

  child.position.y=-7;

  child.name="OFFSPRING";

  g.add(child);

}


/* =====================================================
   COMPLEMENT
   ===================================================== */

function complement(base){

  if(base==="A")return "T";
  if(base==="T")return "A";
  if(base==="G")return "C";
  return "G";

}

/* =====================================================
   SEQUENCE
   ===================================================== */

function renderSequence(){

  const box=
    document.getElementById("seq");

  if(!box)return;

  box.innerHTML="";

  sequence.forEach(
    function(base,index){

      const button=
        document.createElement("button");

      button.className=
        "base"+
        (
          index===selectedIndex
          ?" selected"
          :""
        );

      button.textContent=base;

      button.style.color=
        "#"+
        BASE_COLOR[base]
          .toString(16)
          .padStart(6,"0");


      button.onclick=function(){

        selectedIndex=index;

        renderSequence();

      };


      box.appendChild(button);

    }
  );


  const info=
    document.getElementById(
      "dnaInfo"
    );

  if(info){

    if(selectedIndex<0){

      info.textContent=
        "Select a base to edit the virtual sequence.";

    }else{

      info.textContent=
        "POSITION "+
        (selectedIndex+1)+
        " • "+
        sequence[selectedIndex]+
        " • COMPLEMENT "+
        complement(
          sequence[selectedIndex]
        );

    }

  }

}


/* =====================================================
   DNA HISTORY
   ===================================================== */

function saveHistory(){

  history.push(
    sequence.slice()
  );

  if(history.length>25){
    history.shift();
  }

}


/* =====================================================
   MUTATION
   ===================================================== */

function mutate(){

  saveHistory();

  if(selectedIndex<0){

    selectedIndex=
      Math.floor(
        Math.random()*
        sequence.length
      );

  }

  const old=
    sequence[selectedIndex];

  const choices=
    ["A","T","G","C"]
      .filter(
        b=>b!==old
      );

  sequence[selectedIndex]=
    choices[
      Math.floor(
        Math.random()*
        choices.length
      )
    ];

  createDNA();
  renderSequence();

  toast(
    "VIRTUAL MUTATION"
  );

}


/* =====================================================
   INSERT
   ===================================================== */

function insertBase(){

  saveHistory();

  const bases=[
    "A","T","G","C"
  ];

  const base=
    bases[
      Math.floor(
        Math.random()*4
      )
    ];

  const index=
    selectedIndex<0
    ?sequence.length
    :selectedIndex+1;

  sequence.splice(
    index,
    0,
    base
  );

  selectedIndex=index;

  createDNA();

  renderSequence();

  toast(
    "VIRTUAL BASE INSERTED"
  );

}


/* =====================================================
   DELETE
   ===================================================== */

function deleteBase(){

  if(sequence.length<=8){

    toast(
      "SIMULATION LIMIT REACHED"
    );

    return;

  }

  saveHistory();

  const index=
    selectedIndex<0
    ?sequence.length-1
    :selectedIndex;

  sequence.splice(
    index,
    1
  );

  selectedIndex=
    Math.min(
      index,
      sequence.length-1
    );

  createDNA();

  renderSequence();

  toast(
    "VIRTUAL BASE REMOVED"
  );

}


/* =====================================================
   UNDO
   ===================================================== */

function undo(){

  if(!history.length){

    toast(
      "NOTHING TO UNDO"
    );

    return;

  }

  sequence=
    history.pop();

  createDNA();

  renderSequence();

  toast(
    "DNA STATE RESTORED"
  );

}


/* =====================================================
   REPLICATION
   ===================================================== */

function replicate(){

  setMode("dna");

  const g=groups.dna;

  let scale=.75;

  g.scale.set(
    scale,
    scale,
    scale
  );

  const timer=
    setInterval(
      function(){

        scale+=.035;

        g.scale.set(
          scale,
          scale,
          scale
        );

        if(scale>=1){

          clearInterval(timer);

          toast(
            "DNA REPLICATION SIMULATION"
          );

        }

      },
      35
    );

}

/* =====================================================
   CRISPR CONCEPT
   ===================================================== */

function crispr(){

  setMode("dna");

  toast(
    "CONCEPTUAL CRISPR SIMULATION"
  );

  let t=0;

  const timer=
    setInterval(
      function(){

        t+=.15;

        const s=
          1+
          Math.sin(t)*.04;

        groups.dna.scale.set(
          s,
          s,
          s
        );

        if(t>Math.PI*4){

          clearInterval(timer);

          groups.dna.scale.set(
            1,
            1,
            1
          );

          toast(
            "VIRTUAL EDIT COMPLETE"
          );

        }

      },
      30
    );

}

/* =====================================================
   OBJECT SELECTION
   ===================================================== */

function selectObject(event){

  if(currentMode!=="dna"){
    return;
  }

  const rect=
    renderer.domElement
      .getBoundingClientRect();

  const mouse=
    new THREE.Vector2();

  mouse.x=
    ((event.clientX-rect.left)/
      rect.width)*2-1;

  mouse.y=
    -((event.clientY-rect.top)/
      rect.height)*2+1;


  const raycaster=
    new THREE.Raycaster();

  raycaster.setFromCamera(
    mouse,
    camera
  );


  const hits=
    raycaster.intersectObjects(
      groups.dna.children,
      true
    );


  if(!hits.length)return;


  const object=
    hits[0].object;

  if(
    typeof object.userData.index===
    "number"
  ){

    selectedIndex=
      object.userData.index;

    openDNA();

    toast(
      "BASE "+
      (selectedIndex+1)+
      " SELECTED"
    );

  }

}

/* =====================================================
   TOAST
   ===================================================== */

let toastTimer;

function toast(message){

  const element=
    document.getElementById(
      "toast"
    );

  element.textContent=message;

  element.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer=
    setTimeout(
      function(){

        element.classList.remove(
          "show"
        );

      },
      2200
    );

}


/* =====================================================
   RESIZE
   ===================================================== */

function resize(){

  if(!camera || !renderer){
    return;
  }

  camera.aspect=
    window.innerWidth/
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

}


/* =====================================================
   ANIMATION
   ===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );

  const time=
    performance.now()*.001;


  if(groups.cell.visible){
    groups.cell.rotation.y=
      time*.08;
  }


  if(groups.nucleus.visible){
    groups.nucleus.rotation.y=
      time*.04;
  }


  if(groups.chromosome.visible){
    groups.chromosome.rotation.y=
      Math.sin(time*.5)*.2;
  }


  if(groups.dna.visible){
    groups.dna.rotation.y=
      time*.22;
  }


  if(groups.rna.visible){
    groups.rna.rotation.z=
      Math.sin(time*.5)*.15;
  }


  if(groups.protein.visible){
    groups.protein.rotation.y=
      time*.12;
  }


  if(groups.genetics.visible){
    groups.genetics.rotation.y=
      Math.sin(time*.4)*.15;
  }


  renderer.render(
    scene,
    camera
  );

}
